input,select,textarea{padding:8px 10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}.bar input.d{flex:1;min-width:140px}.bar select{max-width:240px}.pk{position:relative;flex:2;min-width:280px}.pk input{width:100%}.pkl{display:none;position:absolute;left:0;top:100%;margin-top:4px;min-width:100%;width:600px;max-width:92vw;max-height:380px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:40;text-align:left}.pko{padding:9px 12px;cursor:pointer;border-top:1px solid var(--bd)}.pko:first-child{border-top:0}.pko:hover,.pko.on{background:var(--bg)}.pko b{display:block;font-weight:600}.pkh{position:sticky;top:0;padding:6px 12px;background:var(--bg);color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--bd)}.pkh:first-child{border-top:0}.kb{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}.kcol.em{flex:0 0 120px;min-height:90px}.kcol.em .kch{font-size:12px}.kcol{flex:0 0 280px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;min-height:180px;padding:8px}.kcol.over{box-shadow:inset 0 0 0 2px var(--ac)}.kcol.bad{opacity:.35}.kch{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:2px 4px 8px}.kc{background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:8px;overflow:hidden}.kc.run{border-color:var(--rd)}.kd{padding:8px 10px;cursor:grab}.kd:active{cursor:grabbing}.ka{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 10px 8px;border-top:1px dashed var(--bd)}.qa{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.qa input{width:56px}.ni{vertical-align:-2px}.nb .ni{width:12px;height:12px}.kc.hn{border-left:4px solid #f2c94c}.nb{display:inline-block;background:#f2c94c;color:#333;border-radius:10px;padding:0 7px;font-size:11px;font-weight:600;cursor:pointer;margin-left:4px}.rb{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;background:var(--rd);color:#fff;border:1px solid var(--rd);border-radius:6px;padding:10px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(239,83,80,.45);font-size:15px}.rb.ps{background:var(--mu);border-color:var(--mu);box-shadow:0 4px 14px rgba(0,0,0,.25)}.rb .mu{color:rgba(255,255,255,.8)}.rb .clock{font-size:20px;color:#fff}.rb button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.55)}.rb button:hover{background:rgba(255,255,255,.3)}.rb .pri.stop{background:#fff;color:var(--rd);border-color:#fff}.rb.ps .pri.stop{color:var(--mu)}.bar.live{border-color:var(--rd);border-left-width:5px;background:color-mix(in srgb,var(--rd) 8%,var(--card))}.bar.live.ps{border-color:var(--mu);background:var(--card)}.bar.live .clock{color:var(--rd)}.bar.live .clock::before{content:"● ";animation:bl 1.2s infinite}.bar.live.ps .clock{color:var(--mu)}.bar.live.ps .clock::before{content:"⏸ ";animation:none}nav a.live::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rd);margin-left:8px;animation:bl 1.2s infinite}.rb .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb .rd{color:#fff;animation:bl 1.2s infinite}.rb.ps .rd{animation:none}@keyframes bl{50%{opacity:.3}}@media(max-width:700px){.rb{flex-wrap:wrap}.rb .rt{flex-basis:100%}}.pko span{font-size:12px;color:var(--mu)}.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.pad{position:sticky;top:12px}.sn{position:relative;margin-bottom:10px;background:#fff59d;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(-.6deg)}.sn.c1{background:#ffd6e0}.sn.c2{background:#c8f2c2}.sn.t1{transform:rotate(.5deg)}.sn textarea{width:100%;background:transparent;border:0;resize:vertical;color:#333;padding:10px 24px 10px 10px;font:13px/1.35 "Segoe Print","Comic Sans MS",system-ui,sans-serif;min-height:72px}.sn .ic{position:absolute;top:2px;right:2px;color:#555}.sn:focus-within{z-index:30}.nt{padding:0 10px 8px;font-size:11px;color:#333}.nt a{color:#0b5cad!important}.pad .pk{min-width:0}.pad .pkl{width:380px;left:auto;right:0}.sn .pk input{background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.15);font-size:12px;color:#333;padding:3px 6px}.sn textarea{padding-top:16px}.tn{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}.tn textarea{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;resize:vertical}.gh{position:absolute;left:6px;top:1px;cursor:grab;color:#555;font-size:14px;line-height:1;user-select:none}.gh:active{cursor:grabbing}.dbb{box-shadow:0 -3px 0 0 var(--ac)}.dba{box-shadow:0 3px 0 0 var(--ac)}@media(max-width:1000px){.tgrid{grid-template-columns:1fr}.pad{position:static}}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.ch0{color:var(--mu);font-weight:600;text-align:center;font-size:12px}.cd{min-height:92px;border:1px solid var(--bd);border-radius:6px;padding:4px 6px;cursor:pointer;overflow:hidden}.cd.e{border:0;cursor:default}.cd:hover{background:var(--bg)}.cd.td{border-color:var(--ac)}.cd.sel{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ac)}.dn{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.dn b{color:var(--tx)}.ch{font-size:11px;background:var(--bg);border-radius:3px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch i{font-style:normal;color:var(--ac2)}@media(max-width:700px){.cd{min-height:56px}.ch{display:none}}
button{cursor:pointer}.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;padding:8px 18px}.pri:hover{background:var(--ac2)}.pri.stop{background:var(--rd);border-color:var(--rd)}
.clock{font:600 18px ui-monospace,Menlo,monospace;min-width:84px;text-align:center}

.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--bd)}
.row .t{flex:1;min-width:0}.row .s{color:var(--ac2);font-size:12px}.mu{color:var(--mu)}
.ic{border:0;background:none;padding:4px 8px;color:var(--mu)}.ic:hover{color:var(--ac2)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;text-align:left;border-top:1px solid var(--bd)}th{color:var(--mu);font-weight:600;border:0}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.chart b{display:block;background:var(--ac);border-radius:3px 3px 0 0;margin-bottom:4px}
.msg{margin-top:8px;color:var(--mu)}.err{color:var(--rd)}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px;border:0;border-bottom:1px solid var(--bd)}.logo{padding:8px}nav a{white-space:nowrap}main{padding:12px}}
</style></head><body>
<nav><div class="logo">⏱ SprintTracker</div>
<a data-v="track">Time tracker</a><a data-v="sprints">Sprints</a><a data-v="board">Board</a><a data-v="report">Reports</a><a data-v="conn">DevOps connection</a><button class="ic" id="th" onclick="theme()" style="margin-top:12px;width:100%;text-align:left"></button></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const demo=[
{id:101,title:"Login page redesign",type:"User Story",sprint:"Sprint 14",est:12,state:"Active"},
{id:102,title:"API: user profile endpoint",type:"Task",parent:101,who:"Anna Jensen",sprint:"Sprint 14",est:8,state:"Active"},
{id:103,title:"Fix invoice export bug",type:"Bug",parent:101,who:"Ben Hansen",sprint:"Sprint 14",est:4,state:"New"},
{id:104,title:"Set up CI/CD pipeline",type:"Task",who:"Anna Jensen",sprint:"Sprint 14",est:10,state:"Done"},
{id:95,title:"Notifications (email)",type:"User Story",sprint:"Sprint 13",est:16,state:"Done"},
{id:96,title:"Performance-test dashboard",type:"Task",parent:95,who:"Ben Hansen",sprint:"Sprint 13",est:6,state:"Done"}];
let S={items:demo,entries:[],run:null,sprint:"Sprint 14",view:"track",cfg:{org:"",project:"",team:"",pat:""},manual:false};
try{const x=JSON.parse(localStorage.getItem("st1")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem("st1",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sprints=()=>[...new Set(S.items.map(i=>i.sprint))];
const dur=ms=>{const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")};
const hrs=ms=>fm(Math.round(ms/6e4));
const item=id=>S.items.find(i=>i.id==id);
const canLog=i=>/^(task|bug)$/i.test(i.type),isBug=i=>/^bug$/i.test(i.type),par=i=>i.parent&&!isBug(i)?S.items.find(x=>x.id==i.parent):null;
const used=i=>(+i.done||0)*60+Math.round(logged(i.id)/6e4)-(S.pushed[i.id]||0);
const lbl=i=>"#"+i.id+" "+i.title+(par(i)?" ‹ "+par(i).title:"")+(i.who?" – "+i.who:"");
function picker(id,sel,attr="",ph=""){const it=sel?item(sel):null;return`<div class="pk"><input id="${id}" placeholder="${ph||"Search task\u2026"}" value="${esc(it?lbl(it):"")}" ${attr} autocomplete="off" onfocus="pkOpen('${id}',1);this.select()" oninput="pkOpen('${id}')" onblur="setTimeout(()=>pkClose('${id}'),150)" onkeydown="pkKey(event,'${id}')"><div class="pkl" id="pl_${id}"></div></div>`}
let pkI=0;
function pkOpen(id,all){const q=all?"":$("#"+id).value.toLowerCase().trim(),L=$("#pl_"+id),w=q.split(/\s+/).filter(Boolean),sp=[S.sprint,...sprints().filter(x=>x!==S.sprint)],a=S.items.filter(i=>(canLog(i)||/^n[lk]/.test(id))&&w.every(x=>lbl(i).toLowerCase().includes(x))).sort((x,y)=>sp.indexOf(x.sprint)-sp.indexOf(y.sprint)).slice(0,60);pkI=0;let last=null,n=0;L.innerHTML=a.length?a.map(i=>{let h="";if(i.sprint!==last){last=i.sprint;h=`<div class="pkh">${esc(i.sprint||"No sprint")}${i.sprint===S.sprint?" \u00b7 selected":""}</div>`}return h+`<div class="pko${n++?"":" on"}" data-id="${i.id}" onmousedown="pkPick('${id}',${i.id})"><b>#${i.id} ${esc(i.title)}</b><span>${par(i)?"\u2039 "+esc(par(i).title)+" \u00b7 ":""}${i.who?esc(i.who)+" \u00b7 ":""}${(used(i)/60).toFixed(1)}/${i.est||0} h</span></div>`}).join(""):'<div class="pko mu">No matching tasks</div>';L.style.display="block"}
function pkClose(id){const L=$("#pl_"+id);if(L)L.style.display="none"}
function pkPick(id,n){const el=$("#"+id);el.value=lbl(item(n));pkClose(id);el.dispatchEvent(new Event("change"))}
function pkKey(e,id){const L=$("#pl_"+id),o=[...L.querySelectorAll(".pko[data-id]")];if(e.key==="Escape")return pkClose(id);if(L.style.display!=="block")return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();pkI=(pkI+(e.key==="ArrowDown"?1:-1)+o.length)%Math.max(o.length,1);o.forEach((x,n)=>x.classList.toggle("on",n==pkI));o[pkI]?.scrollIntoView({block:"nearest"})}else if(e.key==="Enter"&&o[pkI]){e.preventDefault();pkPick(id,+o[pkI].dataset.id)}}
function pickId(id){const v=($("#"+id).value||"").trim();if(!v)return"";const a=S.items.filter(i=>canLog(i)||/^n[lk]/.test(id));let m=a.find(i=>lbl(i)==v);if(!m){const n=v.match(/^#?(\d+)\b/);if(n)m=a.find(i=>i.id==n[1])}if(!m){const f=a.filter(i=>lbl(i).toLowerCase().includes(v.toLowerCase()));if(f.length==1)m=f[0]}return m?m.id:""}
function setHM(id){const e=S.entries.find(x=>x.id==id);if(e){e.min=Math.max(0,Math.round((+$("#h"+id).value||0)*60+(+$("#m"+id).value||0)));save();render()}}
function quick(id){const m=Math.round((+$("#qh"+id).value||0)*60+(+$("#qm"+id).value||0));if(m<=0)return note("Enter hours or minutes.");add(id,item(id).title,dayKey(Date.now()),m);save();render();activate(id)}
function warn(){const o=S.items.filter(i=>canLog(i)&&i.est>0&&used(i)>i.est*60);return o.length?`<div class="card" style="border-color:var(--rd);color:var(--rd)">Over Original Estimate: ${o.map(i=>"#"+i.id+" "+esc(i.title)+" ("+fm(used(i))+" / "+i.est+" h)").join(", ")}</div>`:""}
function tree(a){const o=[],seen=new Set(),add=(i,l)=>{seen.add(i.id);o.push({i,lvl:l})},kids=(p,f)=>a.filter(c=>c.parent==p.id&&!seen.has(c.id)&&f(c)).forEach(c=>add(c,1));a.forEach(x=>{if(seen.has(x.id))return;const p=canLog(x)?par(x):x;if(p&&!canLog(p)){if(seen.has(p.id))return;add(p,0);kids(p,c=>!isBug(c))}});const rest=a.filter(x=>!seen.has(x.id));if(rest.length&&o.length)o.push({sep:1});rest.forEach(x=>{if(seen.has(x.id))return;const p=canLog(x)&&!isBug(x)?S.items.find(y=>y.id==x.parent):null;if(p&&isBug(p)&&a.includes(p))return;add(x,0);kids(x,c=>canLog(c)&&!isBug(c))});return o}
const logged=id=>S.entries.filter(e=>e.itemId==id).reduce((a,e)=>a+e.min*6e4,0);
const dayKey=t=>new Date(t).toLocaleDateString("sv-SE");
const fm=m=>Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
S.entries=S.entries.map(e=>e.min!=null?e:{id:e.id,itemId:e.itemId,desc:e.desc,date:dayKey(e.start),min:Math.max(1,Math.round((e.end-e.start)/6e4))});
function add(itemId,desc,date,min){const x=S.entries.find(e=>e.date==date&&String(e.itemId)==String(itemId)&&e.desc==desc);if(x)x.min+=min;else S.entries.push({id:Date.now()*1000+Math.floor(Math.random()*1000),itemId,desc,date,min})}
const opts=sel=>sprints().map(sp=>`<optgroup label="${esc(sp)}">`+S.items.filter(i=>i.sprint==sp&&(canLog(i)||i.id==sel)).map(i=>`<option value="${i.id}" ${i.id==sel?"selected":""}>#${i.id} ${esc(i.title)} ${par(i)?" ‹ "+esc(par(i).title):""}${i.who?" – "+esc(i.who):""} (${(used(i)/60).toFixed(1)}/${i.est||0} h)</option>`).join("")+"</optgroup>").join("");
function note(t){let n=$("#note");if(!n){n=document.createElement("div");n.id="note";n.className="card";n.style.cssText="position:fixed;right:16px;bottom:16px;z-index:60;margin:0;max-width:320px;border-color:var(--rd);color:var(--rd)";document.body.appendChild(n)}n.textContent=t;n.style.display="block";clearTimeout(n._t);n._t=setTimeout(()=>{n.style.display="none"},4000)}
const lk=i=>i&&i.az&&S.cfg.org&&S.cfg.project?` <a href="https://dev.azure.com/${encodeURIComponent(S.cfg.org)}/${encodeURIComponent(S.cfg.project)}/_workitems/edit/${i.id}" target="_blank" rel="noopener" title="Open in DevOps" style="margin-left:6px;color:var(--ac2);text-decoration:none">↗</a>`:"";
const elapsed=()=>S.run?(S.run.acc||0)+(S.run.paused?0:Date.now()-S.run.start):0;
function pause(){const r=S.run;if(!r)return;if(r.paused){r.start=Date.now();r.paused=false}else{r.acc=(r.acc||0)+Date.now()-r.start;r.paused=true}save();render()}
function start(itemId,desc){if(!itemId||!item(itemId)||!canLog(item(itemId)))return note("Pick a task before starting the timer.");if(S.run){stop();if(S.run)return}S.run={itemId:itemId||"",desc:desc||(item(itemId)?.title||""),start:Date.now(),t0:Date.now(),acc:0,paused:false};save();render();activate(itemId)}
function stop(){if(!S.run)return;if(!S.run.itemId||!item(S.run.itemId))return note("Pick a task before stopping, so the time is logged on it.");add(S.run.itemId,S.run.desc,dayKey(S.run.t0||S.run.start),Math.max(1,Math.round(elapsed()/6e4)));S.run=null;save();render()}
function render(){
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==S.view));
 $("#app").innerHTML=runBar()+({track:vTrack,sprints:vSprints,board:vBoard,report:vReport,conn:vConn})[S.view]()+modal();liveUI();
}
function vTrack(){
 const r=S.run;
 let bar=S.manual&&!r?`<input class="d" id="md" placeholder="What did you work on?">${picker("mi","")}<input type="date" id="mdt" value="${dayKey(Date.now())}"><input type="number" id="mh" min="0" value="1" style="width:56px" title="Hours"> h <input type="number" id="mm" min="0" max="59" value="0" style="width:56px" title="Minutes"> m<button class="pri" onclick="addManual()">Add</button>`
 :`<input class="d" id="desc" placeholder="What are you working on?" value="${esc(r?r.desc:"")}" ${r?'oninput="S.run.desc=this.value;save()"':""}>${picker("sel",r?.itemId,r?`onchange="const v=pickId('sel');if(v){S.run.itemId=v;save()}"`:"")}<span class="clock" id="clock" style="${r?.paused?"opacity:.45":""}">${r?dur(elapsed()):"00:00:00"}</span>${r?`<button onclick="pause()">${r.paused?"RESUME":"PAUSE"}</button>`:""}<button class="pri ${r?"stop":""}" onclick="${r?"stop()":"start(pickId('sel'),$('#desc').value)"}">${r?"STOP":"START"}</button>`;
 const mode=r?"":`<button class="ic" title="Switch mode" onclick="S.manual=!S.manual;render()">${S.manual?"⏱":"✎"}</button>`;
 const g={};[...S.entries].sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>(g[e.date]??=[]).push(e));

 ${cal()}<div class="card"><div class="mu">Last 7 days (all sprints)</div><div class="chart">${Object.entries(byDay).map(([k,v])=>`<div><b style="height:${v/mx*90}px"></b>${new Date(k).toLocaleDateString("en-GB",{weekday:"short"})}<br>${(v/36e5).toFixed(1)}</div>`).join("")}</div></div>
 <div class="card"><table><tr><th>Work item</th><th>Assigned</th><th>Estimate</th><th>Used</th><th>Remaining</th></tr>${its.filter(i=>S.entries.some(e=>String(e.itemId)==String(i.id))).map(i=>{const l=used(i)/60;return`<tr><td>#${i.id} ${esc(i.title)}${par(i)?'<div class="mu" style="font-size:12px">'+esc(par(i).title)+"</div>":""}</td><td>${esc(i.who||"")}</td><td>${i.est||0} h</td><td>${l.toFixed(1)} h</td><td style="color:${l>i.est?"var(--rd)":"var(--gr)"}">${((i.est||0)-l).toFixed(1)} h</td></tr>`}).join("")||'<tr><td colspan="5" class="mu">No time logged on tasks in this sprint.</td></tr>'}</table></div>`}
function notes(){const A=S.notes||[],fl=S.nfilter||"free";A.forEach((n,i)=>{if(n.color==null)n.color=(i+1)%3==0?2:(i+1)%2==0?1:0});const N=fl=="all"?A:A.filter(n=>!(n.itemId&&item(n.itemId))),fo=S.npadfold;return`<aside class="pad"><div class="mu" style="margin-bottom:8px;font-weight:600;cursor:pointer;user-select:none" onclick="S.npadfold=!S.npadfold;save();render()">${fo?"\u25b8":"\u25be"} Notes (${A.length})</div><div style="display:${fo?"none":"block"}"><div style="display:flex;gap:4px;margin-bottom:8px"><button class="${fl=="free"?"pri":""}" style="padding:3px 8px;font-size:12px" onclick="S.nfilter='free';save();render()">Unlinked (${A.filter(n=>!(n.itemId&&item(n.itemId))).length})</button><button class="${fl=="all"?"pri":""}" style="padding:3px 8px;font-size:12px" onclick="S.nfilter='all';save();render()">All (${A.length})</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="nn" placeholder="New note\u2026" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')noteAdd()"><button class="pri" style="padding:7px 12px" title="Add note" onclick="noteAdd()">+</button></div><div style="margin-bottom:10px">${picker("nl","","","Link to task / story / bug (optional)\u2026")}</div><div>${N.map(n=>`<div class="sn c${n.color} t${n.id%2}" ondragover="noteOver(event,${n.id})" ondrop="noteDrop(event,${n.id})"><span class="gh" draggable="true" title="Drag to reorder" ondragstart="noteDrag(event,${n.id})" ondragend="noteEnd()">⠿</span><textarea rows="3" onchange="noteSet(${n.id},this.value)">${esc(n.text)}</textarea><button class="ic" title="Delete note" onclick="noteDel(${n.id})">\u2715</button><div class="nt">${n.itemId&&item(n.itemId)?`🔗 <b>#${n.itemId}</b> ${esc(item(n.itemId).title)}${lk(item(n.itemId))} <button class="ic" style="position:static;padding:0 4px" title="Unlink" onclick="noteUnlink(${n.id})">\u2715</button>`:picker("nk"+n.id,"",`onchange="noteLink(${n.id})"`,"Link to task / story / bug\u2026")}</div></div>`).join("")||'<div class="mu" style="font-size:12px">'+(A.length&&fl=="free"?"No unlinked notes. Switch to All to see the linked ones.":"Jot down small notes to yourself.")+'</div>'}</div></div></aside>`}
function noteAdd(){const v=$("#nn").value.trim();if(!v)return;(S.notes=S.notes||[]).unshift({id:Date.now(),text:v,color:Math.floor(Math.random()*3),itemId:pickId("nl")||undefined});save();render()}
function noteSet(id,v){if(!v.trim())return noteDel(id);const n=(S.notes||[]).find(x=>x.id==id);if(n){n.text=v;save()}}
function noteLink(id){const v=pickId("nk"+id),n=(S.notes||[]).find(x=>x.id==id);if(v&&n){n.itemId=v;save();render()}}
function noteUnlink(id){const n=(S.notes||[]).find(x=>x.id==id);if(n){delete n.itemId;save();render()}}
let dragId=null,dropAfter=false;
function noteDrag(e,id){dragId=id;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(id));const el=e.target.closest(".sn");e.dataTransfer.setDragImage(el,20,10);setTimeout(()=>{el.style.opacity=.4},0)}
function noteOver(e,id){if(dragId==null)return;e.preventDefault();const r=e.currentTarget.getBoundingClientRect();dropAfter=e.clientY>r.top+r.height/2;document.querySelectorAll(".sn").forEach(x=>x.classList.remove("dba","dbb"));if(dragId!=id)e.currentTarget.classList.add(dropAfter?"dba":"dbb")}
function noteEnd(){dragId=null;document.querySelectorAll(".sn").forEach(x=>{x.classList.remove("dba","dbb");x.style.opacity=""})}
function noteDrop(e,id){e.preventDefault();if(dragId==null||dragId==id)return noteEnd();const N=S.notes||[],from=N.findIndex(x=>x.id==dragId);if(from<0)return noteEnd();const [m]=N.splice(from,1);let to=N.findIndex(x=>x.id==id);if(to<0)to=N.length;if(dropAfter)to++;N.splice(to,0,m);dragId=null;save();render()}
function tnotes(i){(S.notes||[]).forEach((n,k)=>{if(n.color==null)n.color=(k+1)%3==0?2:(k+1)%2==0?1:0});const L=(S.notes||[]).filter(n=>String(n.itemId)==String(i.id));return`<div style="margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px"><div class="mu" style="font-weight:600;font-size:12px;margin-bottom:4px;cursor:pointer;user-select:none" onclick="nfold('s${i.id}')">${(S.nfold||{})['s'+i.id]?"\u25b8":"\u25be"} ${NI} Notes (${L.length})</div><div style="display:${(S.nfold||{})['s'+i.id]?"none":"block"}">${L.map(n=>`<div class="tn c${n.color}"><textarea rows="2" onchange="noteSet(${n.id},this.value)">${esc(n.text)}</textarea><button class="ic" title="Delete note" onclick="noteDel(${n.id})">\u2715</button></div>`).join("")}<div style="display:flex;gap:6px"><input id="tn${i.id}" placeholder="Add a note to this task\u2026" style="flex:1;min-width:0" onkeydown="if(event.key===\'Enter\')tnAdd(${i.id})"><button onclick="tnAdd(${i.id})">Add note</button></div></div></div>`}
function nfold(k){S.nfold=S.nfold||{};S.nfold[k]=!S.nfold[k];save();render()}
function rowNotes(e,seen){const key=String(e.itemId||"");if(!key||seen.has(key))return"";(S.notes||[]).forEach((n,k)=>{if(n.color==null)n.color=(k+1)%3==0?2:(k+1)%2==0?1:0});const L=(S.notes||[]).filter(n=>String(n.itemId)==key);if(!L.length)return"";seen.add(key);const f=(S.nfold||{})[key];return`<div style="padding:0 14px 8px 28px"><div class="mu" style="cursor:pointer;font-size:12px;padding:2px 0;user-select:none" onclick="nfold('${key}')">${f?"▸":"▾"} ${NI} Notes (${L.length})</div>${f?"":L.map(n=>`<div class="tn c${n.color}"><textarea rows="2" onchange="noteSet(${n.id},this.value)">${esc(n.text)}</textarea><button class="ic" title="Delete note" onclick="noteDel(${n.id})">✕</button></div>`).join("")}</div>`}
function tnAdd(id){const v=$("#tn"+id).value.trim();if(!v)return;(S.notes=S.notes||[]).unshift({id:Date.now(),text:v,color:Math.floor(Math.random()*3),itemId:id});save();render()}
function noteDel(id){S.notes=(S.notes||[]).filter(x=>x.id!=id);save();render()}
const curM=()=>S.calMonth||dayKey(Date.now()).slice(0,7);
function calGo(n){const [Y,M]=curM().split("-").map(Number),d=new Date(Y,M-1+n,1);S.calMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");S.calDay=null;save();render()}
function cal(){
 const m=curM(),[Y,M]=m.split("-").map(Number),first=new Date(Y,M-1,1),off=(first.getDay()+6)%7,dim=new Date(Y,M,0).getDate(),today=dayKey(Date.now()),by={};
 S.entries.forEach(e=>{if(e.date.startsWith(m))(by[e.date]??=[]).push(e)});
 let cells="";for(let i=0;i<off;i++)cells+='<div class="cd e"></div>';
 for(let d=1;d<=dim;d++){const k=m+"-"+String(d).padStart(2,"0"),L=by[k]||[],tot=L.reduce((a,e)=>a+e.min,0);
  cells+=`<div class="cd${k==today?" td":""}${k==S.calDay?" sel":""}" onclick="S.calDay='${k}';save();render()"><div class="dn"><span>${d}</span>${tot?`<b>${fm(tot)}</b>`:""}</div>${L.slice(0,3).map(e=>{const i=item(e.itemId);return`<div class="ch" title="${esc(i?lbl(i):e.desc)}">${i?"#"+i.id+" "+esc(i.title):esc(e.desc||"")} <i>${fm(e.min)}</i></div>`}).join("")}${L.length>3?`<div class="mu" style="font-size:11px">+${L.length-3} more</div>`:""}</div>`}
 const mt=Object.values(by).flat().reduce((a,e)=>a+e.min,0),sl=S.calDay&&S.calDay.startsWith(m)?by[S.calDay]||[]:null;
 const det=S.calDay&&S.calDay.startsWith(m)?`<div style="margin-top:14px"><b>${new Date(S.calDay+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</b> <span class="mu">\u00b7 ${fm(sl.reduce((a,e)=>a+e.min,0))}</span>${sl.map(e=>{const i=item(e.itemId);return`<div class="row" style="padding:7px 0"><div class="t">${i?"#"+i.id+" "+esc(i.title)+(par(i)?" \u2039 "+esc(par(i).title):""):'<span style="color:var(--rd)">No task</span>'}${e.desc&&(!i||e.desc!=i.title)?`<div class="s">${esc(e.desc)}</div>`:""}</div><b>${fm(e.min)}</b><button class="ic" title="Edit" onclick="ed(${e.id})">\u270e</button></div>`}).join("")||'<div class="mu" style="padding:8px 0">No time logged this day.</div>'}</div>`:"";
 return`<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button onclick="calGo(-1)">\u25c0</button><b style="min-width:150px;text-align:center">${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</b><button onclick="calGo(1)">\u25b6</button><button onclick="S.calMonth=null;S.calDay=null;save();render()">Today</button><span class="mu" style="margin-left:auto">Month total: <b>${fm(mt)}</b></span></div><div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="ch0">${d}</div>`).join("")}${cells}</div>${det}</div>`}
function csv(){const r=[["Date","Minutes","Hours","Work item","User story","Assigned to","Sprint","Description"]];S.entries.forEach(e=>{const i=item(e.itemId);r.push([e.date,e.min,(e.min/60).toFixed(2),i?i.id:"",i&&par(i)?par(i).title:"",i?i.who||"":"",i?i.sprint:"",e.desc])});
 const t=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\ufeff"+t);a.download="time-entries.csv";a.click()}
function vConn(){const c=S.cfg;return`<h2>DevOps connection</h2>
<div class="card"><b>Fetch sprints directly from Azure DevOps</b><div class="grid" style="margin:10px 0"><input id="o" placeholder="Organization" value="${esc(c.org)}"><input id="p" placeholder="Project" value="${esc(c.project)}"><input id="t" placeholder="Team (e.g. Project Team)" value="${esc(c.team)}"><input id="k" type="password" placeholder="Personal Access Token (Work Items: Read & Write)" value="${esc(c.pat)}"></div>
<button class="pri" onclick="fetchAz()">Fetch sprints</button><div class="msg" id="m1">Note: for security reasons the hosted page cannot call external APIs. Download the file and open it locally for live fetching, or use the import below. Syncing back to DevOps requires a PAT with Work Items: Read & Write, and only work items fetched directly from DevOps can be synced.</div></div>
<div class="card"><b>Import work items (JSON)</b><div class="mu" style="margin:6px 0">Format: [{"id":1,"title":"…","type":"Task","sprint":"Sprint 15","est":8,"state":"Active"}]</div><textarea id="j" rows="5" style="width:100%" placeholder="Paste JSON here"></textarea><div style="margin-top:8px"><button class="pri" onclick="imp()">Import</button> <button onclick="S.items=demo;save();render()">Restore demo data</button></div><div class="msg" id="m2"></div></div>`}
function imp(){try{const a=JSON.parse($("#j").value);if(!Array.isArray(a))throw 0;S.items=a.map(x=>({id:x.id,title:x.title,type:x.type||"Task",sprint:x.sprint||"No sprint",est:+x.est||0,state:x.state||"",parent:x.parent,who:x.who}));save();$("#m2").textContent="Imported "+a.length+" work items.";}catch(e){$("#m2").innerHTML='<span class="err">Invalid JSON</span>'}}
async function fetchAz(){
 const c=S.cfg={org:$("#o").value.trim(),project:$("#p").value.trim(),team:$("#t").value.trim()||$("#p").value.trim()+" Team",pat:$("#k").value.trim()};save();
 const m=$("#m1"),H={Authorization:"Basic "+btoa(":"+c.pat),"Content-Type":"application/json"},B=`https://dev.azure.com/${encodeURIComponent(c.org)}`;
 const g=async u=>{const r=await fetch(u,{headers:H});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
 try{m.textContent="Fetching iterations…";
  const all=(await g(`${B}/${encodeURIComponent(c.project)}/${encodeURIComponent(c.team)}/_apis/work/teamsettings/iterations?api-version=7.1`)).value,cur=all.find(x=>x.attributes?.timeFrame==="current")||all.filter(x=>x.attributes?.timeFrame!=="future").at(-1)||all.at(-1),nxt=cur?all[all.indexOf(cur)+1]:null,its=cur?[cur,nxt].filter(Boolean):[];if(!its.length)throw new Error("no sprint found");
  const out=[];
  for(const it of its){m.textContent="Fetching "+it.name+"…";
   const rel=await g(`${B}/${encodeURIComponent(c.project)}/${encodeURIComponent(c.team)}/_apis/work/teamsettings/iterations/${it.id}/workitems?api-version=7.1`);
   const ids=[...new Set((rel.workItemRelations||[]).map(x=>x.target?.id).filter(Boolean))].slice(0,200);if(!ids.length)continue;
   const r=await fetch(`${B}/_apis/wit/workitemsbatch?api-version=7.1`,{method:"POST",headers:H,body:JSON.stringify({ids,fields:["System.Id","System.Title","System.WorkItemType","System.State","Microsoft.VSTS.Scheduling.OriginalEstimate","Microsoft.VSTS.Scheduling.CompletedWork","System.Parent","System.AssignedTo"]})});
   (await r.json()).value.forEach(w=>out.push({id:w.id,title:w.fields["System.Title"],type:w.fields["System.WorkItemType"],state:w.fields["System.State"],est:w.fields["Microsoft.VSTS.Scheduling.OriginalEstimate"]||0,az:1,done:w.fields["Microsoft.VSTS.Scheduling.CompletedWork"]||0,parent:w.fields["System.Parent"],who:(a=>a?a.displayName||a:"")(w.fields["System.AssignedTo"]),sprint:it.name}))}
  const have=new Set(out.map(x=>x.id)),miss=[...new Set(out.map(x=>x.parent).filter(p=>p&&!have.has(p)))];if(miss.length){m.textContent="Fetching user stories…";const r2=await fetch(`${B}/_apis/wit/workitemsbatch?api-version=7.1`,{method:"POST",headers:H,body:JSON.stringify({ids:miss.slice(0,200),fields:["System.Id","System.Title","System.WorkItemType","System.State","System.Parent"]})});(await r2.json()).value.forEach(w=>{const k=out.find(x=>x.parent==w.id);out.push({id:w.id,title:w.fields["System.Title"],type:w.fields["System.WorkItemType"],state:w.fields["System.State"],est:0,az:1,parent:w.fields["System.Parent"],sprint:k.sprint})})}
m.textContent="Fetching statuses…";S.states=S.states||{};for(const t of [...new Set(out.filter(canLog).map(x=>x.type))]){try{const sr=await g(`${B}/${encodeURIComponent(c.project)}/_apis/wit/workitemtypes/${encodeURIComponent(t)}/states?api-version=7.1-preview.1`);S.states[t]=sr.value.map(x=>({name:x.name,category:x.category,color:x.color}))}catch(e){}}
S.items=out.concat(S.items.filter(x=>!out.some(y=>y.id==x.id)&&S.entries.some(e=>String(e.itemId)==String(x.id))));S.sprint=its[0].name;save();m.textContent="Fetched "+out.length+" work items from "+its.map(x=>x.name).join(" + ")+".";
 }catch(e){m.innerHTML='<span class="err">Could not fetch ('+esc(e.message)+'). If you are in the hosted view, external calls are blocked – open the file locally or use JSON import.</span>'}}
function theme(){S.theme=({"":"dark",dark:"light",light:""})[S.theme||""];save();applyTheme()}
function applyTheme(){const t=S.theme||"",r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;$("#th").textContent="◐ Theme: "+({"":"Auto",dark:"Dark",light:"Light"})[t]}
applyTheme();
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>{S.view=a.dataset.v;render()});
setInterval(()=>{const c=$("#clock");if(c&&S.run)c.textContent=dur(elapsed());document.querySelectorAll(".kclk,.rclk").forEach(x=>{if(S.run)x.textContent=dur(elapsed())});liveTitle()},500);
render();
</script></body></html>
